<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simulation SDAI complète - Voyants distincts + Alim/Batterie</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  h2 {
    margin-top: 30px;
  }
  .central {
    border: 2px solid #333;
    padding: 15px;
    margin-bottom: 30px;
    border-radius: 8px;
  }
  .voyants {
    margin: 12px 0 18px 0;
    display: flex;
    gap: 18px;
  }
  .voyant {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: bold;
    cursor: default;
    user-select: none;
  }
  .light {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #aaa;
    box-shadow: inset 0 0 5px #666;
  }
  .light.alarm {
    background: #f44336; /* rouge */
    box-shadow: 0 0 8px #f44336;
  }
  .light.derangement {
    background: #ff9800; /* orange */
    box-shadow: 0 0 8px #ff9800;
  }
  .light.asservissement {
    background: #2196f3; /* bleu */
    box-shadow: 0 0 8px #2196f3;
  }

  /* Nouveaux styles voyants alimentation/batterie */
  .light.alim-ok {
    background: #4caf50; /* vert secteur */
    box-shadow: 0 0 8px #4caf50;
  }
  .light.alim-off {
    background: #555; /* éteint / gris */
    box-shadow: none;
    opacity: 0.5;
  }
  .light.batt-idle {
    background: #777; /* batterie en veille (gris) */
    box-shadow: none;
    opacity: 0.6;
  }
  .light.batt-on {
    background: #ff9800; /* orange - sur batterie */
    box-shadow: 0 0 8px #ff9800;
  }
  .light.batt-fail {
    background: #f44336; /* rouge - batterie HS */
    box-shadow: 0 0 8px #f44336;
  }

  .indicator {
    font-weight: bold;
    font-size: 1.3em;
    padding: 5px 10px;
    border-radius: 6px;
    width: max-content;
    margin-bottom: 15px;
  }
  .indicator.normal {
    background-color: #4caf50;
    color: white;
  }
  .indicator.degrade {
    background-color: #ff9800;
    color: white;
  }
  .indicator.critique {
    background-color: #f44336;
    color: white;
  }
  .cpu {
    padding: 8px 12px;
    margin: 6px 0;
    border-radius: 8px;
    color: white;
    font-weight: bold;
    width: 200px;
    user-select: none;
  }
  .cpu.normal {
    background-color: #4caf50;
  }
  .cpu.suspect {
    background-color: #ff9800;
    animation: blink 1s infinite;
  }
  .cpu.off {
    background-color: #f44336;
  }
  @keyframes blink {
    0%, 100% {opacity: 1;}
    50% {opacity: 0.5;}
  }
  .detector, .button {
    display: inline-block;
    padding: 8px 12px;
    margin: 4px;
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
  }
  .detector.normal {
    background-color: #ddd;
    color: #333;
  }
  .detector.alarm {
    background-color: #f44336;
    color: white;
  }
  .button.normal {
    background-color: #2196f3;
    color: white;
  }
  .button.pressed {
    background-color: #0b74d1;
    color: white;
  }
  .cable {
    margin: 10px 0;
  }
  .cable.connected {
    color: #4caf50;
    font-weight: bold;
  }
  .cable.cut {
    color: #f44336;
    font-weight: bold;
  }

  /* Zone Alimentation séparée (option 3) */
  .power-section {
    margin-top: 12px;
    padding: 10px;
    border: 1px dashed #999;
    border-radius: 8px;
    max-width: 420px;
  }
  .power-row {
    display:flex;
    gap:12px;
    align-items:center;
    margin-bottom:8px;
  }
  .power-label { font-weight:bold; }

  button.sim-btn {
    margin: 6px 6px 6px 0;
    padding: 6px 12px;
    font-size: 0.9em;
  }
  #log {
    margin-top: 20px;
    border: 1px solid #ddd;
    height: 180px;
    overflow-y: auto;
    padding: 10px;
    background: #f9f9f9;
    font-family: monospace;
    white-space: pre-line;
  }
  /* Responsive design pour smartphones */
@media (max-width: 600px) {
  body {
    margin: 10px;
    font-size: 14px;
  }

  h1 {
    font-size: 1.5em;
  }

  h2 {
    font-size: 1.3em;
  }

  h3 {
    font-size: 1.1em;
  }

  .central {
    padding: 10px;
    margin-bottom: 20px;
  }

  .voyants {
    flex-direction: column;
    gap: 12px;
  }

  .voyant {
    font-size: 0.9em;
  }

  .light {
    width: 14px;
    height: 14px;
  }

.cpu {
  padding: 8px 12px;
  margin: 6px 0;
  border-radius: 8px;
  color: white;
  font-weight: bold;
  max-width: 100%;
  box-sizing: border-box;
  user-select: none;
}


  .detector, .button {
    padding: 6px 8px;
    margin: 4px 2px;
    font-size: 0.9em;
    width: 48%; /* Deux éléments par ligne */
    box-sizing: border-box;
  }

  .detector {
    margin-bottom: 8px;
  }

  .button {
    margin-bottom: 8px;
  }

  button.sim-btn {
    font-size: 0.85em;
    padding: 5px 8px;
    margin: 5px 3px 5px 0;
  }

  #log {
    height: 140px;
    font-size: 0.85em;
  }
}

</style>
</head>
<body>

<h1>Simulation SDAI complète - Voyants distincts</h1>

<div id="centrals-container"></div>

<button onclick="resetSimulation()" class="sim-btn">Réinitialiser toute la simulation</button>

<h3>Journal des événements (log)</h3>
<div id="log"></div>

<script>
  // Constants et états
  const STATES = {
    NORMAL: "normal",
    DEGRADE: "degrade",
    CRITIQUE: "critique"
  };

  const CPU_STATUS = {
    NORMAL: "normal",
    SUSPECT: "suspect",
    OFF: "off"
  };

  // Création des centrales (conserve tout)
  const centrales = {
    1: {
      id: 1,
      name: "Centrale 1",
      cpus: [
        { id: "CPU1-1", badHeartbeats: 0, status: CPU_STATUS.NORMAL },
        { id: "CPU1-2", badHeartbeats: 0, status: CPU_STATUS.NORMAL }
      ],
      detectors: [
        { id: "D1-1", alarm: false },
        { id: "D1-2", alarm: false },
        { id: "D1-3", alarm: false }
      ],
      buttons: [
        { id: "B1-1", pressed: false },
        { id: "B1-2", pressed: false }
      ],
      cables: {
        inputs: true
      },
      // Alimentation ajoutée (secteur + batterie)
      powerSupply: "ok", // "ok" ou "ko" (secteur)
      batteryOK: true,   // true = batterie opérationnelle, false = batterie HS

      systemState: STATES.NORMAL,
      alarmValidated: false,
      derangementDetected: false,
      asservissementActive: false
    },

  };

  // Logs
  const logEl = document.getElementById("log");
  function log(message) {
    const time = new Date().toLocaleTimeString();
    const line = `[${time}] ${message}`;
    console.log(line);
    logEl.textContent += line + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }

  // Simule envoi LEVAC (ici via log)
  function sendLevacSignal(centralId, message) {
    const c = centrales[centralId];
    log(`[LEVAC] ${c.name} : ${message}`);
    // Ici on simule; si besoin d'intégrer un envoi réel, on le met ici.
  }

  // Création affichage centrales dynamique
  function createCentralUI(central) {
    const container = document.createElement("div");
    container.className = "central";
    container.id = `central-${central.id}`;

    const title = document.createElement("h2");
    title.textContent = central.name;
    container.appendChild(title);

    // Voyants lumineux Alarme / Dérangement / Asservissement (un asservissement par centrale)
    const voyantsDiv = document.createElement("div");
    voyantsDiv.className = "voyants";

    // Voyant Alarme
    const alarmVoyant = document.createElement("div");
    alarmVoyant.className = "voyant";
    alarmVoyant.innerHTML = `<div id="voyant-alarm-${central.id}" class="light"></div><span>Alarme</span>`;
    voyantsDiv.appendChild(alarmVoyant);

    // Voyant Dérangement
    const derangementVoyant = document.createElement("div");
    derangementVoyant.className = "voyant";
    derangementVoyant.innerHTML = `<div id="voyant-derangement-${central.id}" class="light"></div><span>Dérangement</span>`;
    voyantsDiv.appendChild(derangementVoyant);

    // Voyant Asservissement (1 par centrale)
    const asservVoyant = document.createElement("div");
    asservVoyant.className = "voyant";
    asservVoyant.innerHTML = `<div id="voyant-asservissement-${central.id}" class="light"></div><span>Asservissement</span>`;
    voyantsDiv.appendChild(asservVoyant);

    container.appendChild(voyantsDiv);

    // État système centrale (texte global)
    const stateIndicator = document.createElement("div");
    stateIndicator.id = `central-state-${central.id}`;
    stateIndicator.className = `indicator ${central.systemState}`;
    stateIndicator.textContent = stateText(central.systemState);
    container.appendChild(stateIndicator);

    // CPUs
    const cpuTitle = document.createElement("h3");
    cpuTitle.textContent = "CPUs";
    container.appendChild(cpuTitle);

    central.cpus.forEach(cpu => {
      const cpuEl = document.createElement("div");
      cpuEl.id = cpu.id;
      cpuEl.className = `cpu ${cpu.status}`;
      cpuEl.textContent = `${cpu.id} - ${cpu.status.toUpperCase()}`;
      container.appendChild(cpuEl);
    });

    // Câble entrée
    const cableEl = document.createElement("div");
    cableEl.id = `cable-input-${central.id}`;
    cableEl.className = `cable ${central.cables.inputs ? "connected" : "cut"}`;
    cableEl.textContent = `Câble Entrée: ${central.cables.inputs ? "CONNECTÉ" : "COUPÉ"}`;
    container.appendChild(cableEl);

    // Zone alimentation (séparée)
    const powerSection = document.createElement("div");
    powerSection.className = "power-section";
    powerSection.innerHTML = `<div style="font-weight:bold; margin-bottom:6px">Alimentation</div>`;

    // Voyants alim + batterie (séparés)
    const powerRow = document.createElement("div");
    powerRow.className = "power-row";
    powerRow.innerHTML = `
      <div style="display:flex;gap:8px;align-items:center">
        <div id="voyant-alim-${central.id}" class="light"></div>
        <div class="power-label">Secteur</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <div id="voyant-batt-${central.id}" class="light"></div>
        <div class="power-label">Batterie</div>
      </div>
    `;
    powerSection.appendChild(powerRow);

    // Statut texte alimentation
    const powerStatus = document.createElement("div");
    powerStatus.id = `power-status-${central.id}`;
    powerStatus.style.marginTop = "6px";
    powerStatus.textContent = `Secteur: ${central.powerSupply === "ok" ? "OK" : "COUPÉ"} — Batterie: ${central.batteryOK ? "OK" : "HS"}`;
    powerSection.appendChild(powerStatus);

    // Boutons de simulation alimentation/batterie
    const powerBtns = document.createElement("div");
    powerBtns.style.marginTop = "8px";

    const togglePowerBtn = document.createElement("button");
    togglePowerBtn.textContent = central.powerSupply === "ok" ? "Couper alimentation" : "Rétablir alimentation";
    togglePowerBtn.className = "sim-btn";
    togglePowerBtn.onclick = () => {
      centrales[central.id].powerSupply = centrales[central.id].powerSupply === "ok" ? "ko" : "ok";
      // quand on rétablit secteur on remet pas automatiquement la batterie OK (mais souvent batterie reste OK)
      if (centrales[central.id].powerSupply === "ok") {
        log(`${central.name} : secteur RÉTABLI`);
      } else {
        log(`${central.name} : secteur COUPÉ -> passage sur batterie si disponible`);
      }
      updateCentralUI(central.id);
      evaluateCentralState(central.id);
    };
    powerBtns.appendChild(togglePowerBtn);

    const toggleBattBtn = document.createElement("button");
    toggleBattBtn.textContent = central.batteryOK ? "Simuler batterie HS" : "Remettre batterie OK";
    toggleBattBtn.className = "sim-btn";
    toggleBattBtn.onclick = () => {
      centrales[central.id].batteryOK = !centrales[central.id].batteryOK;
      log(`${central.name} : batterie ${centrales[central.id].batteryOK ? "OK" : "HS"}`);
      updateCentralUI(central.id);
      evaluateCentralState(central.id);
    };
    powerBtns.appendChild(toggleBattBtn);

    powerSection.appendChild(powerBtns);
    container.appendChild(powerSection);

    // Détecteurs
    const detTitle = document.createElement("h3");
    detTitle.textContent = "Détecteurs (clique pour activer/désactiver)";
    container.appendChild(detTitle);

    central.detectors.forEach(det => {
      const detEl = document.createElement("div");
      detEl.id = det.id;
      detEl.className = `detector ${det.alarm ? "alarm" : "normal"}`;
      detEl.textContent = `${det.id}`;
      detEl.onclick = () => {
        det.alarm = !det.alarm;
        log(`${central.name} - ${det.id} : détecteur ${det.alarm ? "ACTIVÉ" : "DÉSACTIVÉ"}`);
        updateCentralUI(central.id);
        evaluateCentralState(central.id);
      };
      container.appendChild(detEl);
    });

    // Boutons manuels
    const btnTitle = document.createElement("h3");
    btnTitle.textContent = "Boutons manuels (clique pour presser/relâcher)";
    container.appendChild(btnTitle);

    central.buttons.forEach(btn => {
      const btnEl = document.createElement("div");
      btnEl.id = btn.id;
      btnEl.className = `button ${btn.pressed ? "pressed" : "normal"}`;
      btnEl.textContent = btn.id;
      btnEl.onclick = () => {
        btn.pressed = !btn.pressed;
        log(`${central.name} - ${btn.id} : bouton ${btn.pressed ? "PRESSÉ" : "RELÂCHÉ"}`);
        updateCentralUI(central.id);
        evaluateCentralState(central.id);
      };
      container.appendChild(btnEl);
    });

    // Boutons simulation CPU heartbeat corrompu
    const simCpuDiv = document.createElement("div");
    simCpuDiv.style.marginTop = "12px";
    central.cpus.forEach(cpu => {
      const btn = document.createElement("button");
      btn.textContent = `Simuler heartbeat corrompu ${cpu.id}`;
      btn.className = "sim-btn";
      btn.onclick = () => {
        simulateCorruptedHeartbeat(central.id, cpu.id);
      };
      simCpuDiv.appendChild(btn);
    });

    // Bouton couper/rétablir câble entrée
    const cableBtn = document.createElement("button");
    cableBtn.textContent = central.cables.inputs ? "Couper câble entrée" : "Rétablir câble entrée";
    cableBtn.className = "sim-btn";
    cableBtn.onclick = () => {
      centrales[central.id].cables.inputs = !centrales[central.id].cables.inputs;
      log(`${central.name} : câble entrée ${centrales[central.id].cables.inputs ? "rétabli" : "coupé"}`);
      updateCentralUI(central.id);
      evaluateCentralState(central.id);
    };
    simCpuDiv.appendChild(cableBtn);

    container.appendChild(simCpuDiv);

    return container;
  }

  // Texte état système stylé
  function stateText(state) {
    if (state === STATES.NORMAL) return "🟢 NORMAL";
    if (state === STATES.DEGRADE) return "🟠 DÉGRADÉ";
    if (state === STATES.CRITIQUE) return "🔴 CRITIQUE";
    return "ÉTAT INCONNU";
  }

  // Mise à jour visuelle centrale complète
  function updateCentralUI(centralId) {
    const c = centrales[centralId];

    // Mise à jour voyants lumineux (général)
    updateVoyants(centralId);

    // Etat système
    const stateEl = document.getElementById(`central-state-${centralId}`);
    stateEl.className = `indicator ${c.systemState}`;
    stateEl.textContent = stateText(c.systemState);

    // CPUs
    c.cpus.forEach(cpu => {
      const cpuEl = document.getElementById(cpu.id);
      cpuEl.className = `cpu ${cpu.status}`;
      cpuEl.textContent = `${cpu.id} - ${cpu.status.toUpperCase()}`;
    });

    // Câble
    const cableEl = document.getElementById(`cable-input-${centralId}`);
    cableEl.className = `cable ${c.cables.inputs ? "connected" : "cut"}`;
    cableEl.textContent = `Câble Entrée: ${c.cables.inputs ? "CONNECTÉ" : "COUPÉ"}`;

    // Alimentation - statut texte
    const powerStatus = document.getElementById(`power-status-${centralId}`);
    if (powerStatus) {
      powerStatus.textContent = `Secteur: ${c.powerSupply === "ok" ? "OK" : "COUPÉ"} — Batterie: ${c.batteryOK ? "OK" : "HS"}`;
    }

    // Met à jour texte des boutons alimentation si nécessaire
    const container = document.getElementById(`central-${centralId}`);
    if (container) {
      const btns = Array.from(container.getElementsByTagName("button"));
      btns.forEach(btn => {
        if (btn.textContent.includes("Couper alimentation") || btn.textContent.includes("Rétablir alimentation")) {
          btn.textContent = c.powerSupply === "ok" ? "Couper alimentation" : "Rétablir alimentation";
        }
        if (btn.textContent.includes("Simuler batterie") || btn.textContent.includes("Remettre batterie")) {
          btn.textContent = c.batteryOK ? "Simuler batterie HS" : "Remettre batterie OK";
        }
        if (btn.textContent.includes("Couper câble") || btn.textContent.includes("Rétablir câble")) {
          btn.textContent = c.cables.inputs ? "Couper câble entrée" : "Rétablir câble entrée";
        }
      });
    }

    // Détecteurs
    c.detectors.forEach(det => {
      const detEl = document.getElementById(det.id);
      if (detEl) detEl.className = `detector ${det.alarm ? "alarm" : "normal"}`;
    });

    // Boutons manuels
    c.buttons.forEach(btn => {
      const btnEl = document.getElementById(btn.id);
      if (btnEl) btnEl.className = `button ${btn.pressed ? "pressed" : "normal"}`;
    });
  }

  // Mise à jour des voyants lumineux selon état central
  function updateVoyants(centralId) {
    const c = centrales[centralId];

    // Voyant Alarme : activé si alarme validée (detecteurs >= 2 ou bouton pressé)
    const alarmLight = document.getElementById(`voyant-alarm-${centralId}`);
    if (alarmLight) {
      alarmLight.className = "light";
      if (c.alarmValidated) alarmLight.classList.add("alarm");
    }

    // Voyant Dérangement : activé si dérangementDetected
    const derangementLight = document.getElementById(`voyant-derangement-${centralId}`);
    if (derangementLight) {
      derangementLight.className = "light";
      if (c.derangementDetected) derangementLight.classList.add("derangement");
    }

    // Voyant Asservissement : activé si asservissementActive
    const asservLight = document.getElementById(`voyant-asservissement-${centralId}`);
    if (asservLight) {
      asservLight.className = "light";
      if (c.asservissementActive) asservLight.classList.add("asservissement");
    }

    // Voyant Alim (secteur)
    const alimLight = document.getElementById(`voyant-alim-${centralId}`);
    if (alimLight) {
      alimLight.className = "light";
      if (c.powerSupply === "ok") alimLight.classList.add("alim-ok");
      else alimLight.classList.add("alim-off");
    }

    // Voyant Batterie
    const battLight = document.getElementById(`voyant-batt-${centralId}`);
    if (battLight) {
      battLight.className = "light";
      // batterie idle (secteur OK) -> batt-idle
      if (c.powerSupply === "ok" && c.batteryOK) {
        battLight.classList.add("batt-idle");
      } else if (c.powerSupply !== "ok" && c.batteryOK) {
        // sur batterie
        battLight.classList.add("batt-on");
      } else if (!c.batteryOK) {
        // batterie HS
        battLight.classList.add("batt-fail");
      }
    }
  }

  // Fonction simulate heartbeat corrompu (sur CPU spécifique d'une centrale)
  function simulateCorruptedHeartbeat(centralId, cpuId) {
    const central = centrales[centralId];
    const cpu = central.cpus.find(c => c.id === cpuId);
    if (!cpu) return;

    cpu.badHeartbeats++;
    log(`${central.name} - ${cpu.id} : heartbeat CRC invalide (total erreurs: ${cpu.badHeartbeats})`);

    // Gérer les états CPU en fonction du nombre d'erreurs
    if (cpu.badHeartbeats === 1) {
      // 1 erreur : log seul
    } else if (cpu.badHeartbeats === 3) {
      cpu.status = CPU_STATUS.SUSPECT;
      log(`${central.name} - ${cpu.id} : CPU partenaire marqué SUSPECT (mode DÉGRADÉ)`);
    } else if (cpu.badHeartbeats >= 5) {
      cpu.status = CPU_STATUS.OFF;
      log(`${central.name} - ${cpu.id} : CPU partenaire déclaré OFF (mode CRITIQUE)`);
    }

    // Mise à jour des états et affichage
    updateCPUStatus(centralId);
    evaluateCentralState(centralId);
  }

  // Mise à jour état CPU (en fonction des erreurs)
  function updateCPUStatus(centralId) {
    const c = centrales[centralId];

    // Ici pas de changement de statut partenaire CPU (il reste normal)
    // La gestion du relais CPU est implicite dans l'état global
  }

  // Évaluation état global centrale (alarme validée, dérangement, asservissement)
  function evaluateCentralState(centralId) {
    const c = centrales[centralId];

    const activeDetectorsCount = c.detectors.filter(d => d.alarm).length;

    const anyCpuOff = c.cpus.some(cpu => cpu.status === CPU_STATUS.OFF);
    const anyCpuSuspect = c.cpus.some(cpu => cpu.status === CPU_STATUS.SUSPECT);
    const cableInputCut = !c.cables.inputs;
    const anyButtonPressed = c.buttons.some(btn => btn.pressed);

    // --- ALIMENTATION LOGIC ---
    const sectorOK = (c.powerSupply === "ok");
    const batteryOK = !!c.batteryOK;

    // If sector OK, normal alimentation path.
    // If sector KO and battery OK -> intermediate derangement (sur batterie)
    // If sector KO and battery KO -> critical: alarm + asserv + levac
    if (!sectorOK && !batteryOK) {
      // Pas d'alim totale -> ALARME + ASSERV + CRITIQUE
      c.alarmValidated = true;
      c.asservissementActive = true;
      c.derangementDetected = false; // on force l'alarme critique
      c.systemState = STATES.CRITIQUE;
      sendLevacSignal(centralId, "ALERTE : alimentation et batterie HS (etat CRITIQUE)");
      updateCentralUI(centralId);
      return; // sortie rapide car critique prioritaire
    }

    // si secteur KO mais batterie OK -> dérangement intermédiaire
    if (!sectorOK && batteryOK) {
      // dérangement forcé (sur batterie)
      c.derangementDetected = true;
      // alarme validée reste selon détecteurs/buttons (normal logic below)
    } else {
      // secteur OK -> dérangement lié uniquement aux autres facteurs (cpu/cable/det)
      // We'll compute below
      // Ensure we don't incorrectly keep derangement from previous state
      // c.derangementDetected will be recalculated below
    }

    // --- DÉTECTEURS / BOUTONS / CPU logic (conserve ton comportement) ---

    // Dérangement détecté si :
    // - 1 détecteur actif (mais pas 2 ou plus)
    // - CPU off/suspect
    // - câble coupé
    // Note : on garde déjà c.derangementDetected = true si sur batterie (au dessus)
    const detectorsOne = (activeDetectorsCount === 1);
    const detectorsTwoOrMore = (activeDetectorsCount >= 2);

    // Base dérangement (hors alimentation)
    const baseDerangement = detectorsOne || anyCpuOff || anyCpuSuspect || cableInputCut;

    // Merge with battery-derived derangement
    c.derangementDetected = c.derangementDetected || baseDerangement;

    // Alarme validée si :
    // - 2 détecteurs ou plus actifs
    // - ou bouton pressé
    c.alarmValidated = (detectorsTwoOrMore) || anyButtonPressed;

    // Asservissement :
    // - Si alimentation critique (handled above) we returned
    // - Otherwise asserv active if alarmValidated AND NOT (derangement AND battery-only prevents asserv)
    // The user earlier wanted: if on battery => derangement (but not block asserv if alarm validated?)
    // As per latest requirement: if sector KO + battery OK -> DERANGEMENT and asserv should NOT be active (unless we decide differently)
    // We'll implement: when on battery (sectorKO && batteryOK) -> asservissementActive = false
    if (!sectorOK && batteryOK) {
      // on battery => derangement and no asserv
      c.asservissementActive = false;
    } else {
      // sector OK => asserv if alarmValidated (and not derangement that blocks it)
      c.asservissementActive = c.alarmValidated ? true : false;
      // If derangement present we may still allow asserv if alarmValidated (user earlier had variant).
      // To preserve prior behavior: if alarmValidated -> asserv allowed even if derangement, except when on battery-only handling above.
      if (c.alarmValidated && !(!sectorOK && batteryOK)) {
        c.asservissementActive = true;
      }
    }

    // Mise à jour état système global (si pas déjà géré par alarme critique)
    if (anyCpuOff || cableInputCut) {
      c.systemState = STATES.CRITIQUE;
    } else if (anyCpuSuspect || c.derangementDetected) {
      c.systemState = STATES.DEGRADE;
    } else {
      c.systemState = STATES.NORMAL;
    }

    updateCentralUI(centralId);
  }

  // Réinitialiser simulation
  function resetSimulation() {
    Object.values(centrales).forEach(c => {
      c.cpus.forEach(cpu => {
        cpu.badHeartbeats = 0;
        cpu.status = CPU_STATUS.NORMAL;
      });
      c.detectors.forEach(d => d.alarm = false);
      c.buttons.forEach(b => b.pressed = false);
      c.cables.inputs = true;
      c.powerSupply = "ok";
      c.batteryOK = true;
      c.alarmValidated = false;
      c.derangementDetected = false;
      c.asservissementActive = false;
      c.systemState = STATES.NORMAL;
      updateCentralUI(c.id);
    });
    log("Simulation réinitialisée.");
  }

  // Initialisation affichage
  const container = document.getElementById("centrals-container");
  Object.values(centrales).forEach(central => {
    container.appendChild(createCentralUI(central));
    evaluateCentralState(central.id);
  });

</script>
